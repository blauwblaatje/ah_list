name: Release

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/ah_list/manifest.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
